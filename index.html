        kill:   'NAME\n  kill — send a signal to a process\nSYNOPSIS\n  kill [-SIGNAL] <pid>\nOPTIONS\n  -9   SIGKILL — force kill immediately\n  -15  SIGTERM — graceful termination (default)\nDESCRIPTION\n  Send the specified signal to the specified processes or\n  process groups.',
        clear:  'NAME\n  clear — clear the terminal screen\nSYNOPSIS\n  clear\nDESCRIPTION\n  clear clears your screen if this is possible. No output is\n  generated when the terminal is unknown.',
        history:'NAME\n  history — display command history\nSYNOPSIS\n  history [n]\nDESCRIPTION\n  Display the history of previously executed commands.\n  Optional n limits to last n commands.\n  Use ↑↓ arrows in terminal to cycle through history.',
        grep:   'NAME\n  grep — print lines that match patterns\nSYNOPSIS\n  grep [-ni] <pattern> <file>\nOPTIONS\n  -n  show line numbers\n  -i  case-insensitive match\nDESCRIPTION\n  Search for PATTERN in FILE. Output matching lines.\n  Also works in pipes: ls | grep txt',
        find:   'NAME\n  find — search for files in a directory hierarchy\nSYNOPSIS\n  find [path] [-name pattern] [-type f|d]\nEXAMPLES\n  find /home -name "*.txt"\n  find . -type d\nDESCRIPTION\n  Search the directory tree rooted at each given file name.',
        wget:   'NAME\n  wget — non-interactive network downloader\nSYNOPSIS\n  wget <url>\nDESCRIPTION\n  Non-interactive download of files from the Web. Downloads\n  file to current /home/admin directory. Supports HTTP.',
        curl:   'NAME\n  curl — transfer data from or to a server\nSYNOPSIS\n  curl [-s] [-o <file>] <url>\nOPTIONS\n  -s       silent mode\n  -o FILE  write output to FILE\nDESCRIPTION\n  Tool to transfer data from or to a server using URLs.',
        sudo:   'NAME\n  sudo — execute a command as another user\nSYNOPSIS\n  sudo <command> [args]\nDESCRIPTION\n  sudo allows a permitted user to execute a command as the\n  superuser. Prompts for password in real systems.',
        man:    'NAME\n  man — an interface to the system reference manuals\nSYNOPSIS\n  man <command>\nDESCRIPTION\n  man formats and displays the on-line manual pages.\n  Type man <command> for help on any command.',
      };
      const pg = manPages[fargs[0]];
      if(!pg){termPrint('err',`No manual entry for ${fargs[0]}\nTry: man ls, man vim, man grep, etc.`);return;}
      termPrint('info', '─'.repeat(50));
      pg.split('\n').forEach(l=>{
        if(/^NAME|SYNOPSIS|OPTIONS|DESCRIPTION|KEYBINDINGS|EXAMPLES|MODES|COMMANDS/.test(l))
          termPrint('info',l);
        else termPrint('out',l);
      });
      termPrint('info', '─'.repeat(50));
      termPrint('muted', 'Manual page '+fargs[0]+'(1) -- press q to quit (simulated: already shown)');
      return;
    }

    // ── help ──
    case 'help': {
      termPrint('info','═══ StarryOS Terminal — Command Reference ═══');
      termPrint('info','─── Navigation ────────────────────────────────────────');
      termPrint('out', '  ls [-la] [path]    List directory contents');
      termPrint('out', '  cd <path>          Change directory (~ = home)');
      termPrint('out', '  pwd                Print current directory path');
      termPrint('info','─── File Management ───────────────────────────────────');
      termPrint('out', '  mkdir <dir>        Create directory');
      termPrint('out', '  rmdir <dir>        Remove empty directory');
      termPrint('out', '  rm [-rf] <file>    Remove files/directories');
      termPrint('out', '  cp [-r] <src> <dst> Copy files/directories');
      termPrint('out', '  mv <src> <dst>     Move or rename');
      termPrint('out', '  touch <file>       Create empty file / update timestamp');
      termPrint('info','─── File Content ──────────────────────────────────────');
      termPrint('out', '  cat <file>         Display file contents');
      termPrint('out', '  less <file>        Paginated file view');
      termPrint('out', '  head [-n N] <file> Show first N lines (default 10)');
      termPrint('out', '  tail [-n N] <file> Show last N lines (default 10)');
      termPrint('out', '  nano <file>        Interactive text editor (Ctrl+S=save, Ctrl+X=exit)');
      termPrint('out', '  vim <file>         Vi editor (i=insert, :wq=save+quit, :q!=discard)');
      termPrint('out', '  write <file> <txt> Write text to file directly');
      termPrint('info','─── Search ────────────────────────────────────────────');
      termPrint('out', '  grep [-ni] <pat> <file>  Search for pattern in file');
      termPrint('out', '  find [path] [-name pat]  Find files/dirs by name');
      termPrint('info','─── Permissions ───────────────────────────────────────');
      termPrint('out', '  chmod <mode> <file>  Change permissions (e.g. 755, +x)');
      termPrint('out', '  chown <user> <file>  Change file owner (simulated)');
      termPrint('out', '  sudo <cmd>           Run command as root');
      termPrint('info','─── System / Processes ────────────────────────────────');
      termPrint('out', '  ps [aux]      List processes');
      termPrint('out', '  kill [-9] <pid>  Terminate process by PID');
      termPrint('out', '  top           Live process monitor');
      termPrint('out', '  df [-h]       Disk space usage');
      termPrint('out', '  du [-sh] [path]  Directory size');
      termPrint('out', '  free          RAM usage');
      termPrint('out', '  uname [-a]    Kernel/system info');
      termPrint('info','─── Network ───────────────────────────────────────────');
      termPrint('out', '  ping <host>    Test connectivity');
      termPrint('out', '  curl [-s] [-o <file>] <url>  HTTP request');
      termPrint('out', '  wget <url>     Download file (appears in Files)');
      termPrint('out', '  ssh <user@host>  Remote shell (simulated)');
      termPrint('out', '  ifconfig       Network interface info');
      termPrint('info','─── Other ─────────────────────────────────────────────');
      termPrint('out', '  clear        Clear terminal screen');
      termPrint('out', '  history [n]  Show command history');
      termPrint('out', '  man <cmd>    Show manual page for command');
      termPrint('out', '  echo <text>  Print text to terminal');
      termPrint('out', '  date         Show current date/time');
      termPrint('out', '  whoami       Print current user');
      termPrint('out', '  apt install/update/upgrade  Package manager');
      termPrint('muted','─── Tips ──────────────────────────────────────────────');
      termPrint('muted','  Tab = autocomplete commands & filenames');
      termPrint('muted','  ↑↓  = cycle command history');
      termPrint('muted','  Pipe: cmd | grep pattern | wc -l | sort | head N | tail N');
      termPrint('muted','  Files window syncs instantly with terminal changes');
      return;
    }

    // ── unknown ──
    default: {
      const allCmds=['ls','cd','pwd','cat','echo','mkdir','rmdir','touch','rm','cp','mv','nano','vi','vim',
        'write','head','tail','less','grep','find','ps','kill','top','htop','df','du','free','uname',
        'hostname','whoami','id','history','ping','curl','wget','ssh','ifconfig','chmod','chown',
        'sudo','apt','apt-get','env','printenv','export','date','uptime','clear','exit','man','help'];
      const close = allCmds.find(c=>levenshtein(c,cmd)<=2);
      if(close) termPrint('warn',`bash: ${cmd}: command not found — did you mean '${close}'?`);
      else termPrint('err',`bash: ${cmd}: command not found\nType 'help' to see available commands`);
    }
  }
}

function nowStr(){
  const d=new Date();
  return d.toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',','');
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const d=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
  return d[m][n];
}

// ═══════════════════════════════════════════════
//  MEMORY RENDER
// ═══════════════════════════════════════════════
function renderMem(){
  const b=document.getElementById('memBody');
  if(!b)return;
  SYS.recalcMem();
  const pct=Math.min(100,Math.round(SYS.mem_used/SYS.MEM_TOTAL*100));
  const overflow=SYS.mem_used>SYS.MEM_TOTAL;
  b.innerHTML=`
    <div class="mem-total">Total Memory: ${SYS.MEM_TOTAL} MB</div>
    <div class="mem-bar-wrap">
      <div class="mem-bar" style="width:${pct}%;background:linear-gradient(90deg,${pct>80?'#dc2626':'#1d4ed8'},${pct>80?'#ef4444':'#ffd700'});">
        ${pct>10?pct+'%':''}
      </div>
    </div>
    ${overflow?'<div class="mem-overflow">⚠ MEMORY OVERFLOW!</div>':''}
    <div class="mem-stat">
      <div class="mem-card"><div class="val">${SYS.MEM_TOTAL}</div><div class="lbl">Total MB</div></div>
      <div class="mem-card"><div class="val" style="color:${overflow?'#ef4444':'var(--gold)'}">${SYS.mem_used}</div><div class="lbl">Used MB</div></div>
      <div class="mem-card"><div class="val" style="color:#22c55e">${Math.max(0,SYS.mem_free)}</div><div class="lbl">Free MB</div></div>
    </div>
    <div style="margin-top:.75rem;font-size:.68rem;color:var(--muted);border-top:1px solid var(--proc-hdr-border);padding-top:.5rem;">
      ${SYS.processes.length} processes running
    </div>`;
}

// ═══════════════════════════════════════════════
//  PROCESS RENDER
// ═══════════════════════════════════════════════
function renderProc(){
  const b=document.getElementById('procBody');
  if(!b)return;
  b.innerHTML=`
    <div class="proc-hdr"><span>Process</span><span>Mem</span><span>Kill</span></div>
    <ul class="proc-list">
      ${SYS.processes.map(p=>`
        <li class="proc-item">
          <span class="proc-name">● ${p.name} <span style="color:var(--muted);font-size:.6rem">(${p.pid})</span></span>
          <span class="proc-mem">${p.mem} MB</span>
          ${p.pid>3?`<button class="proc-kill" onclick="killFromUI('${p.name}')">✕</button>`:'<span style="color:var(--muted);font-size:.6rem">sys</span>'}
        </li>`).join('')}
    </ul>`;
}
function killFromUI(name){
  const i=SYS.processes.findIndex(p=>p.name===name);
  if(i>=0&&SYS.processes[i].pid>3){SYS.processes.splice(i,1);SYS.recalcMem();}
  renderProc();renderMem();
  if(document.getElementById('termOutput'))termPrint('ok','Killed: '+name);
}

// ═══════════════════════════════════════════════
//  FILES RENDER  — reads from VFS current filesViewPath
// ═══════════════════════════════════════════════
function renderFiles(){
  const b=document.getElementById('filesBody');
  if(!b)return;

  // Sync filesViewPath with terminal's cwd if it's under /home/admin
  // (terminal navigation updates the file view automatically)
  const viewPath = filesViewPath;
  const vfsNode = getNode(viewPath);

  if(!vfsNode){
    b.innerHTML=`<div style="padding:.5rem;font-size:.7rem;color:var(--muted);">
      <div style="margin-bottom:.5rem;">📂 <span style="color:var(--gold)">${viewPath}</span> — Path not found</div>
      <button onclick="filesViewPath='/home/admin';renderFiles();" style="background:transparent;border:1px solid var(--win-border);border-radius:4px;color:var(--muted);font-size:.65rem;padding:.2rem .5rem;cursor:pointer;">→ Home</button>
    </div>`;
    return;
  }

  const allFiles = {};
  if(vfsNode.type==='dir' && vfsNode.children){
    Object.entries(vfsNode.children).forEach(([name, node])=>{
      allFiles[name] = {
        content: node.content||'',
        size: node.size||0,
        mtime: node.mtime||'',
        isDir: node.type==='dir',
        perms: node.perms||''
      };
    });
  }

  const keys = Object.keys(allFiles);
  const parentPath = viewPath==='/' ? null : viewPath.slice(0, viewPath.lastIndexOf('/')||0)||'/';

  // Build breadcrumb
  const parts = viewPath.replace('/home/admin','~').split('/').filter(Boolean);
  const breadcrumb = (viewPath.startsWith('/home/admin') ? ['~',...parts.slice(parts.indexOf('~')+1)] : ['/',... viewPath.split('/').filter(Boolean)]).join(' / ');

  if(!keys.length && !parentPath){
    b.innerHTML=`<div style="padding:.5rem;font-size:.7rem;color:var(--muted);">
      <div style="border-bottom:1px solid var(--file-card-border);padding-bottom:.3rem;margin-bottom:.4rem;font-size:.61rem;color:var(--muted);">
        📂 ${breadcrumb} &nbsp;·&nbsp; empty
      </div>
      <div class="file-empty">Directory is empty.<br>Use terminal: touch &lt;name&gt; or mkdir &lt;name&gt;</div>
    </div>`;
    return;
  }

  // Up/back button
  const upBtn = parentPath!==null
    ? `<span class="file-card" onclick="filesViewPath='${parentPath}';renderFiles();" title="Go up to ${parentPath}" style="cursor:pointer;">
        <div class="file-icon">↩</div>
        <div class="file-name">.. (up)</div>
       </span>`
    : '';

  const cards = keys.map(f=>{
    const meta = allFiles[f];
    const isDir = meta.isDir;
    const fullPath = viewPath.replace(/\/$/,'') + '/' + f;
    const icon = isDir ? '📁'
      : f.endsWith('.py') ? '🐍'
      : f.endsWith('.md') ? '📝'
      : f.endsWith('.sh') ? '⚙️'
      : f.endsWith('.log') ? '📋'
      : f.endsWith('.tar.gz')||f.endsWith('.zip') ? '🗜️'
      : f.endsWith('.html') ? '🌐'
      : f.endsWith('.json') ? '📊'
      : f.endsWith('.txt') ? '📄'
      : '📄';
    const sizeLabel = isDir ? 'dir' : (meta.size||0)+'B';
    const preview = (!isDir && meta.content) ? meta.content.slice(0,80).replace(/</g,'&lt;') : '';
    const clickAct = isDir
      ? `filesViewPath='${fullPath}';renderFiles();`
      : `showFileContent('${fullPath.replace(/'/g,"\\'")}')`;
    const permsTitle = meta.perms ? `\n${meta.perms}` : '';
    return `<div class="file-card" onclick="${clickAct}" title="${isDir?'Directory':'File'}: ${f}${permsTitle}${preview?'\n─\n'+preview:''}">
      <div class="file-icon">${icon}</div>
      <div class="file-name">${f}</div>
      <div style="font-size:.55rem;color:var(--muted);margin-top:.2rem">${sizeLabel}</div>
      ${meta.mtime?`<div style="font-size:.52rem;color:var(--muted);opacity:.6">${meta.mtime}</div>`:''}
    </div>`;
  }).join('');

  b.innerHTML=`<div style="font-size:.61rem;color:var(--muted);padding:.35rem .6rem .15rem;opacity:.65;border-bottom:1px solid var(--file-card-border);margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem;">
    <span>📂 ${breadcrumb}</span>
    <span style="margin-left:auto">${keys.length} item(s)</span>
  </div>
  <div class="file-grid">${upBtn}${cards}</div>`;
}

function showFileContent(fullPath){
  const node = getNode(fullPath);
  if(!node || node.type==='dir') return;
  const name = fullPath.split('/').pop();
  const preview = (node.content||'(empty file)').slice(0,300);
  // Show inline popup in terminal if open, otherwise alert
  if(document.getElementById('termOutput')){
    termPrint('info',`── cat ${name} ──`);
    preview.split('\n').forEach(l=>termPrint('out',l));
    if((node.content||'').length>300) termPrint('muted','... (truncated, use cat in terminal to see full content)');
    const tw = document.getElementById('termWin');
    if(tw) tw.style.zIndex = ++zTop;
  }
}

// ═══════════════════════════════════════════════
//  DEVICES RENDER
// ═══════════════════════════════════════════════
function renderDevs(){
  const b=document.getElementById('devBody');
  if(!b)return;
  b.innerHTML=Object.entries(SYS.devices).map(([name,d])=>`
    <div class="dev-row">
      <span class="dev-icon">${d.icon}</span>
      <span class="dev-name">${name}</span>
      <span class="dev-status ${d.on?'dev-on':'dev-off'}">${d.on?'ON':'OFF'}</span>
      <button class="dev-toggle" onclick="toggleDev('${name}')">${d.on?'Disconnect':'Connect'}</button>
    </div>`).join('');
}
function toggleDev(name){
  SYS.devices[name].on=!SYS.devices[name].on;
  renderDevs();
  if(document.getElementById('termOutput'))
    termPrint('info',name+': '+(SYS.devices[name].on?'connected':'disconnected'));
}

// ═══════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════
runBoot();
</script>
